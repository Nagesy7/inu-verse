<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#E8913A">
<title>Inu Verse</title><link rel="preload" href="fonts/Silkscreen.ttf" as="font" type="font/ttf" crossorigin><link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='18' r='12' fill='%23d98b45'/><path d='M6 12 9 2 14 9zM26 12 23 2 18 9z' fill='%23d98b45'/><ellipse cx='18' cy='22' rx='7' ry='5' fill='%23fff6ea'/></svg>">
<script>window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments)};window.va('beforeSend',function(e){try{var u=new URL(e.url);u.hash='';Array.from(u.searchParams.keys()).forEach(function(k){if(!/^(utm_(source|medium|campaign|content|term)|ref|open)$/.test(k))u.searchParams.delete(k)});e.url=u.toString()}catch(_){}return e});</script>
<script defer src="/_vercel/insights/script.js"></script>
</head><body>
<canvas id="game"></canvas>
<div id="title" class="overlay">
  <canvas id="title-bg" aria-hidden="true"></canvas>
  <div class="title-card">
    <div class="title-left">
    <h1 class="logo">Inu <span>Verse</span></h1>
    <p class="tag">A cosy neighbourhood for the Inu games network</p>
    <canvas id="preview" width="300" height="180"></canvas>
    <div id="pv-cap" class="pv-cap" aria-live="polite"></div>
    </div>
    <div id="creator" class="creator"></div>
    <div class="row"><button id="start" class="btn big">Start new life</button><button id="continue" class="btn big alt" hidden>Continue</button></div>
    <p class="small">WASD / arrows or click to walk · E to interact · Progress saves in your browser</p>
    <p class="small title-links"><a style="color:var(--goldl)" href="https://kibbleinu.com/pay?utm_source=inu-verse&amp;utm_medium=title#shop-h" target="_blank" rel="noopener" data-paid="shop" data-paid-from="title">Cosmetics shop</a> · <a style="color:var(--goldl)" href="https://kibbleinu.com/for-devs.html?utm_source=inu-verse&amp;utm_medium=title" target="_blank" rel="noopener" data-paid="for-devs" data-paid-from="title">For devs</a> · free to play, $KIBBLE optional</p>
  </div>
</div>
<div id="hud" hidden>
  <div class="chip who"><span id="hud-name"></span></div>
  <div class="chip"><i class="ic bone"></i><span id="bones">0</span><small>bones</small></div>
  <div class="chip inu"><i class="ic kib"></i><span id="kibble">0</span><small>KIBBLE</small></div>
  <div class="spacer"></div>
  <button id="btn-phantom" class="btn phantom" title="Sign in with Phantom">Connect Phantom</button>
  <button id="btn-pack" class="btn alt">Pack</button>
  <button id="btn-wardrobe" class="btn alt">Wardrobe</button>
  <button id="btn-garage" class="btn alt">Garage</button>
  <button id="btn-kennel" class="btn alt" title="Your own room to decorate">My Kennel</button><button id="btn-pups" class="btn alt" title="Adopt, feed and play">Pet Pups</button><button id="btn-stamps" class="btn alt" title="Your stamps">Stamp Book</button><button id="btn-party" class="btn alt" title="This month's party and the pin hunt">Party &amp; Pins</button><button id="btn-times" class="btn alt" title="The in-game newspaper">Inu Times</button>
  <button id="btn-companion" class="btn alt">Companion</button>
  <button id="btn-engage" class="btn alt" title="Season pass, referrals, collections">Season</button>
  <button class="chip pools" id="btn-pools" title="Prize pools (skill-based)"><i class="ic kib"></i><span id="pools">pools</span></button>
  <div class="chip streak" id="streak-chip" role="status" tabindex="0" title="Login streak (Sydney days). Tap for details"></div>
  <span class="chip" id="clock">--:--</span>
  <button id="btn-emote" class="btn alt" title="G">Emote</button>
  <button id="btn-photo" class="btn alt" title="P">Photo</button>
  <button id="btn-mute" class="btn ghost" title="M">Sound on</button>
  <button id="btn-guide" class="btn ghost" title="Replay the tour">Guide</button><button id="btn-quests" class="btn ghost" title="Verse place quests">Quests</button><button id="btn-help" class="btn ghost">?</button>
</div>
<div id="prompt" hidden></div>
<div id="minimap-wrap" hidden><canvas id="minimap" width="128" height="140"></canvas></div>
<div id="buildbar" hidden></div>
<div id="panel" class="overlay" hidden><div class="panel-card"><button class="close" id="panel-close">×</button><div id="panel-body"></div></div></div>
<div id="emotes" hidden><button class="btn" data-emote="wave">1 Wave</button><button class="btn" data-emote="sit">2 Sit</button><button class="btn" data-emote="zoomies">3 Zoomies</button><button class="btn" data-emote="dance">4 Dance</button><button class="btn" data-emote="heart">5 Heart</button></div>
<div id="photobar"><b>PHOTO MODE</b><button class="btn green" id="photo-save">Save PNG</button><a class="btn alt" id="photo-share" href="#" target="_blank" rel="noopener">Share to X</a><button class="btn ghost" id="photo-exit">Exit (P)</button></div>
<div id="toast"></div>
<div id="dialog" hidden><div class="dname"></div><div class="dtext"></div><i class="dnext"></i></div>
<div id="zoomctl" style="position:fixed;left:10px;top:76px;z-index:30;display:flex;flex-direction:column;gap:4px;align-items:center"><button id="zin" class="btn alt" title="Zoom in (+ / wheel)" style="min-width:36px">+</button><small id="zlevel" style="color:#f2cc68;font:8px Silkscreen,monospace;text-shadow:0 1px 0 #000">1x</small><button id="zout" class="btn alt" title="Zoom out (- / wheel)" style="min-width:36px">&minus;</button></div>
<div id="touch"><div id="stick"><div id="knob"></div></div><div id="tbtns"><button id="btn-b" class="tb b">B</button><button id="btn-a" class="tb a">A</button><button id="btn-emo" class="tb e" aria-label="Emotes: wave, dance, sit, heart, laugh, photo pose" title="Emotes (G)"><svg viewBox="0 0 16 16" width="24" height="24" shape-rendering="crispEdges" aria-hidden="true"><path fill="#141a2e" d="M5 1h6v1h2v2h1v2h1v4h-1v2h-1v2h-2v1H5v-1H3v-2H2v-2H1V6h1V4h1V2h2z"/><path fill="#ffd84a" d="M5 2h6v1h1v1h1v2h1v4h-1v2h-1v1h-1v1H5v-1H4v-1H3v-2H2V6h1V4h1V3h1z"/><path fill="#141a2e" d="M5 6h2v2H5zM9 6h2v2H9zM4 9h1v1h1v1h4v-1h1V9h1v2h-1v1H5v-1H4z"/><path fill="#ff8fb6" d="M3 9h1v1H3zM12 9h1v1h-1z"/></svg></button><button id="btn-menu" class="tb m">&#9776;</button></div></div>
<div id="fade"></div>
<script type="importmap">{"imports":{"@solana/web3.js":"https://esm.sh/@solana/web3.js@1.98.4"}}</script>
<script src="https://kibble-pay.vercel.app/inu-profile.js" data-game="inu-verse" data-position="top-left" defer></script>
<script src="https://kibble-pay.vercel.app/inu-eco.js" data-game="inu-verse" defer></script>
<script type="module" src="src/main.js"></script>
<script>/* paid_link_click: product + where it was clicked, never wallet data */(function(){window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments)};var c=function(v){return String(v||'').toLowerCase().replace(/[^a-z0-9-]/g,'').slice(0,40)};document.addEventListener('click',function(e){var a=e.target&&e.target.closest&&e.target.closest('[data-paid]');if(a)window.va('event',{name:'paid_link_click',data:{product:c(a.getAttribute('data-paid')),from:c(a.getAttribute('data-paid-from')),site:'inu-verse'}})},true)})();</script>
</body></html>
